server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Vite assets have a hash in their name, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The router uses createWebHistory(): any unknown path is a SPA view, not
    # a 404. index.html is never cached, so a new deploy shows up on reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
